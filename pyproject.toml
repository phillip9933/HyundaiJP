[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Retained conventions in the bundled API and HA integration.
ignore = [
  "N999",   # Public API modules retain their existing PascalCase names.
  "BLE001", # Vendor communication uses catch-all resilience boundaries.
  "DTZ001", "DTZ004", "DTZ005", "DTZ006", "DTZ007", "DTZ011", "DTZ901",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hyundai_jp"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.14"
strict = true
# The runtime dependencies include libraries without distributed type stubs.
ignore_missing_imports = true
files = ["custom_components/hyundai_jp", "scripts"]
