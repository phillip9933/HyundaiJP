name: Release
run-name: Release HyundaiJP ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (for example 0.1.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease (enable prereleases in HACS to install)"
        default: false
        type: boolean

permissions:
  contents: read

# Only one release can create tags and assets at a time. Never cancel a publisher.
concurrency:
  group: hyundaijp-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish versioned HACS release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python -m scripts.publish_release
