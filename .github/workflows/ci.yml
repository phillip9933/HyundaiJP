name: Checks and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline tests, typing and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            custom_components/hyundai_jp/manifest.json
      - name: Install dependencies
        run: python scripts/install_dependencies.py
      - name: Formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Strict typing
        run: mypy
      - name: Offline regression tests
        run: pytest

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS custom repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          # A custom HACS repository does not need a home-assistant/brands entry.
          ignore: brands
          comment: false

  build:
    name: HACS ZIP
    needs: [offline-checks, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build and verify integration archive
        run: python -m scripts.build_release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyundaiJP-${{ github.sha }}
          path: |
            dist/hyundai_jp.zip
            dist/hyundai_jp.zip.sha256
          if-no-files-found: error
          retention-days: 30
